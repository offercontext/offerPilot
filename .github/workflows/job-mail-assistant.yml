name: Job mail assistant synthetic acceptance
on:
  push:
    branches: [master, feat/20261009-job-mail-assistant]
  pull_request:
    branches: [master]
  # Deliberately no paths filter: shared auth/schema/UI changes can affect mail,
  # and a required PR check must not remain pending after a docs-only change.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: job-mail-assistant-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fixed pre-mail commit is needed by the real upgrade regression.
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          npm ci --prefix web
      - name: Backend safety and existing domain regression
        run: |
          uv run pytest -q tests/test_job_mail*.py tests/test_application_events_repository.py tests/test_events_api.py tests/test_calendar_api.py tests/test_auth_api.py tests/test_event_lifecycle_v1.py
          uv run ruff check src/offerpilot/job_mail src/offerpilot/api.py src/offerpilot/cli.py src/offerpilot/db.py tests/test_job_mail*.py tests/fixtures/job_mail_app.py tests/fixtures/job_mail_scheduler_app.py tests/fixtures/job_mail_master_seed.py
          uv run mypy src/offerpilot/job_mail src/offerpilot/api.py src/offerpilot/cli.py src/offerpilot/db.py --follow-imports=silent
      - name: Frontend regression and production build
        run: |
          npm test --prefix web -- src/features/jobMail src/services/jobMail.test.ts src/services/jobMailSecureSetup.test.ts src/layout/AppShell.test.ts src/components/SettingsView.test.ts src/features/reminders src/features/dashboard src/features/pilotMascot
          npm run build --prefix web
          node --test scripts/job-mail-browser-wait.test.mjs
      - name: Install isolated browser harness
        id: browser-harness
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/mail-browser" playwright-core@1.55.1
      - name: Existing synthetic browser regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/job-mail-browser
          export OFFERPILOT_MAIL_FIXTURE_DATA="$RUNNER_TEMP/job-mail-fixture"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/mail-browser/node_modules/playwright-core/index.mjs"
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          export MAIL_EVIDENCE_DIR="$GITHUB_WORKSPACE/artifacts/job-mail-browser"
          .venv/bin/python tests/fixtures/job_mail_app.py > artifacts/job-mail-browser/server.log 2>&1 &
          server=$!
          cleanup() {
            result=$?
            trap - EXIT
            kill "$server" 2>/dev/null || true
            for i in $(seq 1 20); do
              if ! kill -0 "$server" 2>/dev/null; then
                wait "$server" 2>/dev/null || true
                exit "$result"
              fi
              sleep 1
            done
            echo "This fixture PID did not stop within 20 seconds" >&2
            exit 1
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:38091/api/job-mail/status >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:38091/api/job-mail/status >/dev/null
          node scripts/job-mail-browser-smoke.mjs
      - name: Synthetic scheduler browser acceptance and screenshots
        if: ${{ !cancelled() && steps.browser-harness.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/job-mail-scheduler
          export OFFERPILOT_MAIL_FIXTURE_DATA="$RUNNER_TEMP/job-mail-scheduler-fixture"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/mail-browser/node_modules/playwright-core/index.mjs"
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          export MAIL_EVIDENCE_DIR="$GITHUB_WORKSPACE/artifacts/job-mail-scheduler"
          .venv/bin/python tests/fixtures/job_mail_scheduler_app.py > artifacts/job-mail-scheduler/server.log 2>&1 &
          server=$!
          cleanup() {
            result=$?
            trap - EXIT
            kill "$server" 2>/dev/null || true
            for i in $(seq 1 20); do
              if ! kill -0 "$server" 2>/dev/null; then
                wait "$server" 2>/dev/null || true
                exit "$result"
              fi
              sleep 1
            done
            echo "This fixture PID did not stop within 20 seconds" >&2
            exit 1
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:38091/api/job-mail/status >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:38091/api/job-mail/status >/dev/null
          node scripts/job-mail-scheduler-browser.mjs
      - name: Preserve synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-mail-synthetic-evidence-${{ github.sha }}
          path: |
            artifacts/job-mail-browser/*.png
            artifacts/job-mail-browser/result.json
            artifacts/job-mail-scheduler/*.png
            artifacts/job-mail-scheduler/scheduler-result.json
          if-no-files-found: ignore
          retention-days: 7
  windows-native-lock:
    needs: synthetic-acceptance
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - name: Install locked test and offline-guard dependencies
        run: uv sync --frozen
      - name: Verify native lock exclusion and crash release
        run: uv run --frozen pytest --noconftest -q tests/test_job_mail_process_lock.py
