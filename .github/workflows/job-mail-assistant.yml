name: Job mail assistant synthetic acceptance
on:
  push:
    branches: [feat/20261009-job-mail-assistant]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: job-mail-assistant-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          npm ci --prefix web
      - name: Backend safety and existing domain regression
        run: |
          uv run pytest -q tests/test_job_mail*.py tests/test_application_events_repository.py tests/test_events_api.py tests/test_calendar_api.py tests/test_auth_api.py tests/test_event_lifecycle_v1.py
          uv run ruff check src/offerpilot/job_mail src/offerpilot/api.py src/offerpilot/db.py tests/test_job_mail*.py tests/fixtures/job_mail_app.py
          uv run mypy src/offerpilot/job_mail src/offerpilot/api.py src/offerpilot/db.py --follow-imports=silent
      - name: Frontend regression and production build
        run: |
          npm test --prefix web -- src/features/jobMail src/services/jobMail.test.ts src/layout/AppShell.test.ts src/components/SettingsView.test.ts src/features/reminders src/features/dashboard
          npm run build --prefix web
      - name: Install isolated browser harness
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/mail-browser" playwright-core@1.55.1
      - name: Synthetic browser acceptance and screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/job-mail-browser
          export OFFERPILOT_MAIL_FIXTURE_DATA="$RUNNER_TEMP/job-mail-fixture"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/mail-browser/node_modules/playwright-core/index.mjs"
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium)"
          export MAIL_EVIDENCE_DIR="$GITHUB_WORKSPACE/artifacts/job-mail-browser"
          uv run python tests/fixtures/job_mail_app.py > artifacts/job-mail-browser/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:38091/api/job-mail/status >/dev/null; then break; fi
            sleep 1
          done
          node scripts/job-mail-browser-smoke.mjs
      - name: Preserve synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-mail-synthetic-evidence-${{ github.sha }}
          path: |
            artifacts/job-mail-browser/*.png
            artifacts/job-mail-browser/result.json
          if-no-files-found: ignore
          retention-days: 7
