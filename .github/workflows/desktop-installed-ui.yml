name: Installed Windows UI validation (pinned experimental installer)

# Two-step activation: bootstrap this routing with [skip ci], then add request.json.
# No application build and no full regression rerun. Existing runs are not cancelled.
on:
  push:
    branches:
      - feat/20261005-windows-desktop-validation
    paths:
      - 'desktop/installed-ui/**'
      - '.github/workflows/desktop-installed-ui.yml'
      - 'docs/architecture/desktop-installed-ui-validation.md'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  installed-ui:
    name: Pinned installer, screen coverage and restart persistence
    if: ${{ github.repository == 'offercontext/offerPilot' && github.ref == 'refs/heads/feat/20261005-windows-desktop-validation' }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      UI_EVIDENCE_DIR: ${{ github.workspace }}/desktop/installed-ui/evidence
      UI_SOURCE_DIR: ${{ github.workspace }}/.installed-ui-source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record honest scope before any validation
        run: |
          # runner context is unavailable in job.env; initialize this after allocation.
          if (-not $env:RUNNER_TEMP -or -not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) {
            throw 'Runner temporary directory is unavailable'
          }
          $artifactDir = Join-Path $env:RUNNER_TEMP 'offerpilot-pinned-installer'
          "UI_ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force $env:UI_EVIDENCE_DIR | Out-Null
          @(
            'EXPERIMENTAL INSTALLED WINDOWS UI EVIDENCE. NOT RELEASE READY.',
            'Product source commit: 2e78e9489e2c022b979fc2e580870975db2a8cce.',
            'Installer build activation commit: 2e78e9489e2c022b979fc2e580870975db2a8cce.',
            'Installer build workflow: .github/workflows/desktop-windows.yml; build run: 37728772813.',
            'Independent full regression: https://github.com/offercontext/offerPilot/actions/runs/37728772813 (not certified by this job).',
            'No rebuild and no rerun, replacement or cancellation of independent full regression.',
            'Playwright temporarily uses loopback Node inspect/CDP; normal undebugged launch is distinct.',
            'Hosted Windows runners are administrator environments with UAC disabled by the platform.',
            'No OS protection changes. Ordinary-user/UAC/SmartScreen/clean-no-devtools experience is not proven.',
            'Only synthetic data, screenshots and whitelisted JSON are retained; no userData/config/token/headers/HAR/trace.',
            "Installed-UI helper commit: $env:GITHUB_SHA",
            "UI run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -Encoding utf8 -LiteralPath (Join-Path $env:UI_EVIDENCE_DIR 'scope.txt')
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/installed-ui/package-lock.json
      - name: Install only isolated, locked UI test helpers
        run: |
          npm.cmd ci --prefix desktop/installed-ui --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'UI helper dependency installation failed' }
          npm.cmd test --prefix desktop/installed-ui
          if ($LASTEXITCODE -ne 0) { throw 'UI helper contract/routing checks failed' }
      - name: Verify exact product, build and artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm.cmd run verify --prefix desktop/installed-ui
          if ($LASTEXITCODE -ne 0) { throw 'Pinned request/source verification failed' }
      - name: Read original source for packaged entrypoint comparison
        uses: actions/checkout@v4
        with:
          ref: 2e78e9489e2c022b979fc2e580870975db2a8cce
          path: .installed-ui-source
          persist-credentials: false
      - name: Download only the approved artifact from the fixed build run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: offercontext/offerPilot
          run-id: 37728772813
          name: offerpilot-windows-experimental-validation-2e78e9489e2c022b979fc2e580870975db2a8cce
          path: ${{ env.UI_ARTIFACT_DIR }}
      - name: Execute installer, real Electron UI and complete restart checks
        run: |
          npm.cmd run smoke --prefix desktop/installed-ui
          if ($LASTEXITCODE -ne 0) { throw 'Installed UI validation failed; cleanup cannot turn a failure into a pass' }
      - name: Preserve only whitelisted evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installed-ui-evidence-2e78e948-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/installed-ui/evidence/scope.txt
            desktop/installed-ui/evidence/source.json
            desktop/installed-ui/evidence/result.json
            desktop/installed-ui/evidence/coverage.json
            desktop/installed-ui/evidence/screens/*.png
            desktop/installed-ui/evidence/01-first-launch.png
            desktop/installed-ui/evidence/02-saved-detail.png
            desktop/installed-ui/evidence/03-saved-list.png
            desktop/installed-ui/evidence/04-restarted-list.png
            desktop/installed-ui/evidence/05-restarted-detail.png
            desktop/installed-ui/evidence/failure.png
