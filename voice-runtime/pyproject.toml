[project]
name = "offerpilot-voice-runtime"
version = "0.1.0"
description = "Optional local speech runtime for OfferPilot interviews"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pipecat-ai[webrtc,silero]==1.12.0",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
offerpilot-voice = "offerpilot_voice.server:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offerpilot_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
