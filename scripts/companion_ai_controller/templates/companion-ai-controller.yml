# INERT DEPLOYMENT TEMPLATE. Not installed under .github/workflows.
# Owner must explicitly approve deployment, register immutable identities,
# verify branch lock/no bypass, and configure the protected environment first.
name: Companion fixed controller
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
        default: '8848ac33623167cb2c2a58b1e0122abe825810dc'
      ci_run_id:
        required: true
        type: string
        default: '40441381236'
      manifest_sha256:
        required: true
        type: string
        default: '561c83d8295a7aedc925dd474bba58f1188dbf3dfe4a776856d6ae4cef03755e'
permissions:
  contents: read
concurrency:
  group: offerpilot-companion-ai-20261021-one-shot
  cancel-in-progress: false
jobs:
  offline:
    name: Controller offline safety
    if: >-
      github.repository == 'offercontext/offerPilot' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/ai-validation-control' &&
      vars.OFFERPILOT_COMPANION_AI_CONTROLLER_SHA != '' &&
      vars.OFFERPILOT_COMPANION_AI_REGISTRATION != '' &&
      github.sha == vars.OFFERPILOT_COMPANION_AI_CONTROLLER_SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ vars.OFFERPILOT_COMPANION_AI_CONTROLLER_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.19'
      - run: uv sync --frozen
      - run: uv run python -m scripts.companion_ai_controller.test_gate
      - name: Check trusted controller static contracts
        run: |
          uv run ruff check scripts/companion_ai_controller scripts/companion_ai_validation tests/test_companion_ai_platform_contract.py
          uv run mypy scripts/companion_ai_controller/*.py scripts/companion_ai_validation/*.py --follow-imports=silent --explicit-package-bases
      - name: Retain complete controller offline aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: companion-controller-offline-${{ github.sha }}
          path: artifacts/companion-controller-offline.json
          if-no-files-found: error
          retention-days: 14
  preflight:
    name: Controller request preflight
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      before: ${{ steps.verify.outputs.before }}
      summary_url: ${{ steps.verify.outputs.summary_url }}
    env:
      OFFERPILOT_COMPANION_AI_CONTROLLER_SHA: ${{ vars.OFFERPILOT_COMPANION_AI_CONTROLLER_SHA }}
      OFFERPILOT_COMPANION_AI_REGISTRATION: ${{ vars.OFFERPILOT_COMPANION_AI_REGISTRATION }}
      CONTROLLER_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CONTROLLER_CI_RUN_ID: ${{ inputs.ci_run_id }}
      CONTROLLER_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ vars.OFFERPILOT_COMPANION_AI_CONTROLLER_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: verify
        name: Verify immutable code evidence and complete history before approval
        run: python -m scripts.companion_ai_controller.production before
  paid:
    name: Controller approved real AI
    needs: [offline, preflight]
    if: >-
      github.repository == 'offercontext/offerPilot' &&
      github.event_name == 'workflow_dispatch' && github.run_attempt == 1 &&
      github.ref == 'refs/heads/ai-validation-control' &&
      vars.OFFERPILOT_COMPANION_AI_CONTROLLER_SHA != '' &&
      vars.OFFERPILOT_COMPANION_AI_REGISTRATION != '' &&
      github.sha == vars.OFFERPILOT_COMPANION_AI_CONTROLLER_SHA
    environment:
      name: offerpilot-companion-ai-controller
      url: ${{ needs.preflight.outputs.summary_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OFFERPILOT_COMPANION_AI_CONTROLLER_SHA: ${{ vars.OFFERPILOT_COMPANION_AI_CONTROLLER_SHA }}
      OFFERPILOT_COMPANION_AI_REGISTRATION: ${{ vars.OFFERPILOT_COMPANION_AI_REGISTRATION }}
      CONTROLLER_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CONTROLLER_CI_RUN_ID: ${{ inputs.ci_run_id }}
      CONTROLLER_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      CONTROLLER_BEFORE: ${{ needs.preflight.outputs.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ vars.OFFERPILOT_COMPANION_AI_CONTROLLER_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recheck owner approval identities and complete history without provider credential
        run: python -m scripts.companion_ai_controller.production paid
      - name: Recheck again then send exactly six fixed review bodies
        env:
          OFFERPILOT_COMPANION_DEEPSEEK_20261021: ${{ secrets.OFFERPILOT_COMPANION_DEEPSEEK_20261021 }}
        run: python -m scripts.companion_ai_controller.production send --evidence-dir artifacts/companion-controller-paid
      - name: Retain only completed verified evidence archive including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: companion-controller-paid-${{ github.run_id }}
          path: artifacts/companion-controller-paid/evidence.zip
          if-no-files-found: warn
          retention-days: 14
